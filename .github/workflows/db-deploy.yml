# Applies new migrations (supabase/migrations) to the online databases.
#   push to main      -> staging project
#   tag v* (release)  -> production project
# seed.sql is NEVER sent online (no --include-seed).
#
# Repository secrets (GitHub > Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN      personal token from supabase.com/dashboard/account/tokens
#   STAGING_PROJECT_REF        e.g. abcdefghijklmnopqrst
#   STAGING_DB_PASSWORD
#   PRODUCTION_PROJECT_REF
#   PRODUCTION_DB_PASSWORD
# The production job uses the GitHub environment "production": add yourself as a
# required reviewer there to approve each production migration by hand.
name: Deploy database migrations

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}
      DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ] || [ -z "$DB_PASSWORD" ]; then
            echo "::warning::Staging secrets are not set yet: skipping. See docs/DEPLOY.md."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Preview
        if: env.SKIP != '1'
        run: npx supabase db push --remote="$PROJECT_REF" -p "$DB_PASSWORD" --dry-run
      - name: Apply migrations to staging
        if: env.SKIP != '1'
        run: npx supabase db push --remote="$PROJECT_REF" -p "$DB_PASSWORD"

  production:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.PRODUCTION_PROJECT_REF }}
      DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ] || [ -z "$DB_PASSWORD" ]; then
            echo "::error::Production secrets are missing. See docs/DEPLOY.md."
            exit 1
          fi
      - name: Preview
        run: npx supabase db push --remote="$PROJECT_REF" -p "$DB_PASSWORD" --dry-run
      - name: Apply migrations to production
        run: npx supabase db push --remote="$PROJECT_REF" -p "$DB_PASSWORD"
