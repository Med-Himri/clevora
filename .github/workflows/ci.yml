# Every pull request (and every push to main): lint, types, unit tests,
# RLS tests on a local Supabase, a production build and Playwright at 375 / 768 / 1280 px.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run i18n:check
      - run: npm test

  database-and-e2e:
    name: RLS tests, build, Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase
        run: npx supabase start -x studio,edge-runtime,logflare,vector,imgproxy,supavisor
      - name: RLS and database tests (pgTAP)
        run: npx supabase test db
      - name: Reset the database (migrations + demo seed)
        run: npx supabase db reset
      - name: Write .env.local for the tests
        run: bash scripts/ci/write-env.sh
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright (phone, tablet, laptop)
        run: npx playwright test --trace off
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
