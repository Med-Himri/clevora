# Nightly encrypted backup of the production database.
# Secrets (GitHub > Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL     Session pooler connection string of the production project
#   BACKUP_PASSPHRASE   Long random passphrase (keep a copy offline!)
# Each backup is an encrypted artifact kept 30 days. See docs/RESTORE.md.
name: Database backup

on:
  schedule:
    - cron: "17 2 * * *" # every night at 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check secrets
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::error::Set SUPABASE_DB_URL and BACKUP_PASSPHRASE in the repository secrets."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump roles, schema and data
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir backup
          supabase db dump --db-url "$DB_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$DB_URL" -f backup/data.sql --use-copy --data-only
          date -u +"%Y-%m-%dT%H:%M:%SZ" > backup/created_at.txt
          ls -la backup

      - name: Encrypt
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          name="parcolia-db-$(date -u +%Y%m%d-%H%M)"
          tar czf "$name.tar.gz" backup
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" \
              --symmetric --cipher-algo AES256 -o "$name.tar.gz.gpg" "$name.tar.gz"
          rm -rf backup "$name.tar.gz"
          echo "NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz.gpg
          retention-days: 30
          if-no-files-found: error
